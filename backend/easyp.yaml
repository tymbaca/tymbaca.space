# EasyP configuration for the cars service.
# Documentation: https://easyp.tech/docs/guide/introduction/what-is

deps:
  - github.com/googleapis/googleapis

generate:
  inputs:
    - directory: "api"
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - name: go-grpc
      out: .
      opts:
        paths: source_relative
        require_unimplemented_servers: false
    - name: grpc-gateway
      out: .
      opts:
        paths: source_relative
